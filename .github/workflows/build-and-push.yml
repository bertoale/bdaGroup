name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Komponen yang ingin di-build dan push"
        required: true
        type: choice
        options:
          - "all"
          - "app"
          - "nginx"
        default: "all"

jobs:
  build-app:
    name: Build & Push App
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'app' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/bda-group-app:latest

  build-nginx:
    name: Build & Push Nginx
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'nginx' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/bda-group-nginx:latest
